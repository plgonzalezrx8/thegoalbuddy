name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Disabled until exact-source readiness and the tested artifact are delivered
    # to this fresh runner. A release event alone must never authorize publishing.
    if: ${{ false }}
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install trusted publishing npm
        run: npm install --global npm@11.18.0

      - name: Install pinned development dependencies
        env:
          GOALBUDDY_SKIP_POSTINSTALL: "1"
        run: npm ci --no-audit --no-fund

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v$package_version"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $package_version. Expected $expected_tag."
            exit 1
          fi

      - name: Verify npm identity and ownership
        run: npm run publish:identity

      - name: Check npm publish status
        id: npm_status
        run: npm run publish:status

      - name: Verify package
        run: |
          npm run check
          node internal/cli/sync-skill-tree.mjs
          npm run check:readiness -- --report "$THEGOALBUDDY_RELEASE_READINESS"
          npm run check:package -- --tarball "$THEGOALBUDDY_TEST_TARBALL"
          npm run publish:check

      - name: Publish
        if: steps.npm_status.outputs.already_published != 'true'
        run: npm publish "$THEGOALBUDDY_TEST_TARBALL"
