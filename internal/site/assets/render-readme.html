<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1440" />
    <title>thegoalbuddy · Observatory brand artwork</title>
    <style>
      @font-face {
        font-family: "Libre Caslon Display";
        src: url("./libre-caslon-display.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("./dm-sans.woff2") format("woff2");
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1440px;
        height: 760px;
        overflow: hidden;
        background: #040d15;
        color: #f6f1e5;
        font-family: "DM Sans", sans-serif;
      }
      main {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 54px 64px;
        background:
          linear-gradient(90deg, rgba(3, 13, 20, 0.92), rgba(3, 13, 20, 0.32)),
          url("./observatory-sky.webp") center 70% / cover;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 650;
      }
      .brand img {
        width: 46px;
        height: 46px;
      }
      .eyebrow {
        margin: 62px 0 20px;
        font-size: 12px;
        letter-spacing: 0.26em;
        color: #b0bec7;
        text-transform: uppercase;
      }
      h1 {
        font:
          90px/1.02 "Libre Caslon Display",
          Georgia,
          serif;
        letter-spacing: -0.02em;
        margin: 0;
        max-width: 800px;
      }
      .description {
        font-size: 20px;
        color: #d9e5e8;
        margin: 28px 0 0;
      }
      .bottom {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 34px;
        padding-top: 20px;
        border-top: 1px solid #334957;
        color: #b0bec7;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      .star {
        position: absolute;
        right: 100px;
        top: 190px;
        width: 200px;
        height: 200px;
      }
      .bottom strong {
        color: #acf0a4;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="./constellation-star.png" alt="" />thegoalbuddy
      </div>
      <p class="eyebrow">An observatory for your work</p>
      <h1>A constellation.<br />A clear destination.</h1>
      <p class="description">A local observatory for long coding runs.</p>
      <img class="star" src="./constellation-star.png" alt="" />
      <div class="bottom">
        <span>Codex + Claude Code</span
        ><strong>Local files · Lasting direction</strong
        ><span>thegoalbuddy</span>
      </div>
    </main>
  </body>
</html>
